# Render Blueprint: VocaWeb API (Fastify, pnpm monorepo)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: theo-api
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.12.1 --activate &&
      pnpm install --frozen-lockfile --prod=false
    startCommand: >-
      corepack enable &&
      pnpm --filter @theo/api exec tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_STRICT
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Sign-in
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # AI: one key for every model
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: FREE_DAILY_BUILDS
        value: "10"
      - key: XAI_API_KEY
        sync: false
      # Publishing and CORS
      - key: VERCEL_TOKEN
        sync: false
      - key: DEPLOY_BASE_DOMAIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Integrations
      - key: INTEGRATIONS_CALLBACK_BASE
        sync: false
      - key: INTEGRATION_TOKEN_SECRET
        sync: false
      - key: INTEGRATIONS_MCP_ENABLED
        value: "true"
      - key: NOTION_CLIENT_ID
        sync: false
      - key: NOTION_CLIENT_SECRET
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: FIGMA_CLIENT_ID
        sync: false
      - key: FIGMA_CLIENT_SECRET
        sync: false
      - key: CANVA_MCP_CLIENT_ID_URL
        sync: false
